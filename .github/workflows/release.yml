name: release

# Tag push builds both architectures, signs + notarizes when the signing
# secrets are set (see README), and attaches the dmgs and the Windows installer to the GitHub Release.
# `make release VERSION=0.2.0` creates the tag for you.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag is the source of truth for the version: it ends up in the
      # packaged package.json, the artifact names and app.getVersion().
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # Both architectures are cross-built on the arm64 runner: nothing is
      # compiled per architecture (npmRebuild is off), only Electron's zip
      # differs. Empty secrets make electron-builder skip signing and our
      # afterSign hook skip notarization, so the same job works without them.
      # An unset secret still arrives as CSC_LINK="", which electron-builder
      # resolves to the cwd ("... not a file"), so unset the empty ones first.
      - name: Build dmgs
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run dist:mac -- --arm64 --x64
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12 != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the dmgs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$repo" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$repo" \
            dist/Pi-Desktop-*.dmg dist/SHA256SUMS.txt --clobber

      - name: Keep the dmgs as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: dmgs
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build installer
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CERT_PFX != '' }}

      - name: Upload the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          for i in 1 2 3 4 5; do
            gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1 && break
            gh release create "$GITHUB_REF_NAME" --repo "$repo" --generate-notes 2>/dev/null && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$repo"             dist/Pi-Desktop-*-setup.exe --clobber

      - name: Keep the installer as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error
