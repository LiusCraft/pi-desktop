name: release

# Tag push builds both architectures, signs + notarizes when the signing
# secrets are set (see README), and attaches the dmgs and the Windows installer
# to the GitHub Release.
# `make release` creates the tag for you, bumping the latest tag (patch);
# `make release VERSION=0.2.0` tags an explicit version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag is the source of truth for the version: it ends up in the
      # packaged package.json, the artifact names and app.getVersion().
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # Both architectures are cross-built on the arm64 runner: nothing is
      # compiled per architecture (npmRebuild is off), only Electron's zip
      # differs. Empty secrets make electron-builder skip signing and our
      # afterSign hook skip notarization, so the same job works without them.
      # An unset secret still arrives as CSC_LINK="", which electron-builder
      # resolves to the cwd ("... not a file"), so unset the empty ones first.
      - name: Build dmgs
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run dist:mac -- --arm64 --x64
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12 != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the dmgs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$repo" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$repo" \
            dist/Pi-Desktop-*.dmg dist/SHA256SUMS.txt --clobber

      # The cask points at the release assets, so it goes out after they exist: `brew install --cask
      # liuscraft/tap/pi-desktop` is then the macOS upgrade path (`brew upgrade --cask`). Pushing needs a
      # credential for another repository, and a deploy key with write access on homebrew-tap is the
      # narrowest one there is: it reaches that repository and nothing else.
      - name: Push the cask to the Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          cask="$RUNNER_TEMP/pi-desktop.rb"
          node scripts/cask.mjs --version="${GITHUB_REF_NAME#v}" --dist=dist --out="$cask"
          cat "$cask"
          if [ -z "$TAP_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_KEY is not set; the cask was not pushed to liuscraft/homebrew-tap."
            exit 0
          fi
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"
          tap="$RUNNER_TEMP/tap"
          git clone --depth=1 git@github.com:liuscraft/homebrew-tap.git "$tap" ||
            { echo "::error::could not clone liuscraft/homebrew-tap with its deploy key: re-add the key and update HOMEBREW_TAP_KEY."; exit 1; }
          mkdir -p "$tap/Casks"
          cp "$cask" "$tap/Casks/pi-desktop.rb"
          cd "$tap"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::the tap already carries $GITHUB_REF_NAME"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "pi-desktop ${GITHUB_REF_NAME#v}"
          # An empty tap has no upstream yet, so the first push is what creates its branch.
          git push --set-upstream origin HEAD

      - name: Keep the dmgs as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: dmgs
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build installer
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CERT_PFX != '' }}

      - name: Upload the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          for i in 1 2 3 4 5; do
            gh release view "$GITHUB_REF_NAME" --repo "$repo" \
              >/dev/null 2>&1 && break
            gh release create "$GITHUB_REF_NAME" --repo "$repo" \
              --generate-notes 2>/dev/null && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$repo" \
            dist/Pi-Desktop-*-setup.exe --clobber

      - name: Keep the installer as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  plugin:
    # pi-remote is built from the same source as the app (`npm run build:plugin` → plugin/pi-remote/
    # index.js) and takes its version from the same tag, so `pi install npm:@liuscraft/pi-remote`
    # never drifts from the dmg. It waits for the dmg: a plugin whose protocol moved on is useless
    # until the Pi Desktop that speaks it is actually downloadable.
    if: startsWith(github.ref, 'refs/tags/')
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance: the tarball is tied to this commit and workflow
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Trusted publishing (OIDC, no long-lived token) needs npm 11.5.1 or newer.
      - run: npm install --global npm@^11.5.1

      # Only the plugin bundle is built here; Electron's binary is not, so skip its download.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: npm run build:plugin

      - name: Publish to npm
        run: node scripts/publish-plugin.mjs --version="${GITHUB_REF_NAME#v}"
