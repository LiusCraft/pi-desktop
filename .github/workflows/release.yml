name: release

# Tag push builds both architectures, signs + notarizes when the signing
# secrets are set (see README), and attaches the dmgs to the GitHub Release.
# `make release VERSION=0.2.0` creates the tag for you.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$version"
            exit 1
          fi

      # Both architectures are cross-built on the arm64 runner: nothing is
      # compiled per architecture (npmRebuild is off), only Electron's zip
      # differs. Empty secrets make electron-builder skip signing and our
      # afterSign hook skip notarization, so the same job works without them.
      - name: Build dmgs
        run: npm run dist:mac -- --arm64 --x64
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12 != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the dmgs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$repo" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$repo" \
            dist/Pi-Desktop-*.dmg dist/SHA256SUMS.txt --clobber

      - name: Keep the dmgs as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: dmgs
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
