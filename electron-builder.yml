# macOS packaging. Run it through `make` (see Makefile) or electron-builder.
#
# The pi SDK runs inside the agent host (an Electron utilityProcess). It loads its
# own assets, user extensions (through jiti) and prebuilt .node binaries from
# disk, and spawns tool binaries, so asar stays off to keep all of that plain.
appId: dev.pi-desktop.app
productName: Pi Desktop
copyright: Copyright © ${author}

directories:
  output: dist
  buildResources: build

# `npm run build` (electron-vite) must run first; the scripts in package.json do.
files:
  - out/**
  - demo/**
  - package.json

asar: false
# No native modules are compiled at install time: pi-tui ships prebuilt .node
# binaries and everything else is WASM, so a rebuild only adds node-gyp noise.
npmRebuild: false
# Runs after packing + signing, before the dmg is assembled (notarize + staple).
afterSign: ./scripts/after-sign.cjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
  minimumSystemVersion: '12.0'
  # Sign + notarize only when credentials exist; scripts/after-sign.cjs decides.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: Pi-Desktop-${version}-${arch}.${ext}

dmg:
  title: ${productName} ${version}
  artifactName: Pi-Desktop-${version}-${arch}.${ext}
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
      type: file
    - x: 390
      y: 190
      type: link
      path: /Applications

# Not maintained right now (macOS only); kept so the config describes them.
win:
  target: nsis

linux:
  target: AppImage

publish:
  provider: github
  owner: liuscraft
  repo: pi-desktop
