# macOS + Windows packaging. Run it through `make` (see Makefile) or electron-builder.
#
# The pi SDK runs inside the agent host (an Electron utilityProcess). It loads its
# own assets, user extensions (through jiti) and prebuilt .node binaries from
# disk, and spawns tool binaries, so asar stays off to keep all of that plain.
appId: dev.pi-desktop.app
productName: Pi Desktop
copyright: Copyright © ${author}

directories:
  output: dist
  buildResources: build

# `npm run build` (electron-vite) must run first; the scripts in package.json do.
# demo/ stays out of the package: the offline demo only runs unpackaged (dev, tests).
files:
  - out/**
  - package.json
  # Dependency leftovers nothing loads at runtime: sourcemaps and type declarations.
  - '!**/node_modules/**/*.map'
  - '!**/node_modules/**/*.d.{ts,mts,cts}'
  # Uncompiled sources next to the built openai SDK, docs screenshots and the TUI-only mascot art.
  - '!**/node_modules/openai/src/**'
  - '!**/node_modules/@earendil-works/pi-coding-agent/docs/images/**'
  - '!**/node_modules/@earendil-works/pi-coding-agent/dist/modes/interactive/assets/**'

asar: false
# Chromium locale packs are ~45 MB; the UI only ships zh-CN and en.
electronLanguages:
  - en-US
  - zh-CN
# No native modules are compiled at install time: pi-tui ships prebuilt .node
# binaries and everything else is WASM, so a rebuild only adds node-gyp noise.
npmRebuild: false
# Runs after packing + signing, before the dmg is assembled (notarize + staple).
afterSign: ./scripts/after-sign.cjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
  minimumSystemVersion: '12.0'
  # Sign + notarize only when credentials exist; scripts/after-sign.cjs decides.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: Pi-Desktop-${version}-${arch}.${ext}

dmg:
  title: ${productName} ${version}
  artifactName: Pi-Desktop-${version}-${arch}.${ext}
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
      type: file
    - x: 390
      y: 190
      type: link
      path: /Applications

win:
  # electron-builder converts the 1024px png into a multi-size .ico.
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # No code signing by default; set CSC_LINK / CSC_KEY_PASSWORD (or WIN_CSC_*) to sign.
  artifactName: Pi-Desktop-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

# Not maintained right now; kept so the config describes it.
linux:
  target: AppImage

publish:
  provider: github
  owner: liuscraft
  repo: pi-desktop
