<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src http://localhost:* http://127.0.0.1:*; connect-src 'none'">
<title>Pi Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="code.css" />
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="desktop.css" />
</head>
<body data-mode="code" data-os="mac">
<div class="window">

  <!-- 窗口控件（左）：macOS 为红绿灯，Windows 为 ≡ / 侧栏 / ← → -->
  <div class="chrome">
    <div class="traffic mac-only"><i class="tl r"></i><i class="tl y"></i><i class="tl g"></i></div>
    <div class="pop-wrap win-only">
      <button class="ic-btn" id="appMenuBtn" title="Menu">
        <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 5.5h13M3.5 10h9M3.5 14.5h11"/></svg>
      </button>
      <div class="pop" id="appMenu">
        <button class="menu-item" data-m="new">New session<span class="kbd">Ctrl N</span></button>
        <button class="menu-item" data-m="search">Search<span class="kbd">Ctrl K</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-m="theme">Toggle theme</button>
        <button class="menu-item" data-m="os">Window style: macOS</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-m="settings">Settings…<span class="kbd">Ctrl ,</span></button>
        <button class="menu-item" data-m="help">Help</button>
      </div>
    </div>
    <button class="ic-btn" id="toggleSidebar" title="Toggle sidebar  Ctrl+.">
      <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M7.5 3.5v13"/></svg>
    </button>
    <button class="ic-btn mac-only" id="searchBtn" title="Search  ⌘K">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
    </button>
    <button class="ic-btn win-only" id="navBack" title="Back"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 10H4M9 5l-5 5 5 5"/></svg></button>
    <button class="ic-btn win-only" id="navFwd" title="Forward"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10h12M11 5l5 5-5 5"/></svg></button>
  </div>

  <!-- 窗口控件（右）：Windows 最小化 / 最大化 / 关闭 -->
  <div class="winctl win-only">
    <button title="Minimize"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M1 6h10" stroke="currentColor" stroke-width="1"/></svg></button>
    <button title="Maximize"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
    <button class="x" title="Close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1"/></svg></button>
  </div>

<div class="app" id="app">

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-chrome-space"></div>
    <div class="seg" id="modeSwitch">
      <button data-mode="chat">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5.5l1.5 1.5L7 4.5M10 6h7M3 13l1.5 1.5L7 12M10 13.5h7"/></svg>Cowork
      </button>
      <button data-mode="code">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 6 3 10l4 4M13 6l4 4-4 4M11 4.5l-2 11"/></svg>Code
      </button>
    </div>

    <!-- Cowork 导航 -->
    <div class="nav-pane" id="chatNav">
      <nav class="cn-nav">
        <button class="cn-item new-item" id="newChat">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 4v12M4 10h12"/></svg></span>New
        </button>
        <button class="cn-item" data-toast="Projects">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5.5" width="14" height="10.5" rx="1.8"/><path d="M5 3.5h10"/></svg></span>Projects
        </button>
        <button class="cn-item" data-toast="Artifacts">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="13.5" r="3"/><path d="M10 2.8l3.5 6h-7z"/><rect x="11" y="10.5" width="6" height="6" rx="1"/></svg></span>Artifacts
        </button>
        <button class="cn-item" data-toast="Scheduled tasks">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2"/></svg></span>Scheduled
        </button>
        <button class="cn-item" data-toast="Customize：技能、连接器与插件">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="14" height="10" rx="2"/><path d="M7.5 6V4.5h5V6M3 10.5h14"/></svg></span>Customize
        </button>
      </nav>
      <div class="tk-head">
        <span>Tasks</span>
        <button class="ic-btn sm" id="taskSearch" title="Search"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg></button>
        <button class="ic-btn sm" data-toast="Filter tasks" title="Filter"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="1.8"/><circle cx="14" cy="14" r="1.8"/><path d="M6 8v9M6 3v1.2M14 3v9M14 16v1"/></svg></button>
      </div>
      <div class="sb-section">
        <ul class="recents" id="recents"></ul>
      </div>
    </div>

    <!-- Code 导航 -->
    <div class="nav-pane" id="codeNav">
      <nav class="cn-nav">
        <button class="cn-item new-item" id="newSession">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 4v12M4 10h12"/></svg></span>New
        </button>
        <button class="cn-item" id="routinesBtn">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2"/></svg></span>Routines
        </button>
        <button class="cn-item" id="customizeBtn">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="14" height="10" rx="2"/><path d="M7.5 6V4.5h5V6M3 10.5h14"/></svg></span>Customize
        </button>
        <button class="cn-item" id="moreBtn">
          <span class="cn-ico"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="4.5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/></svg></span>More
        </button>
        <div class="cn-more" id="moreList" hidden>
          <button class="cn-item sub" data-toast="Archived sessions">Archived</button>
          <button class="cn-item sub" data-toast="Usage">Usage</button>
          <button class="cn-item sub" data-toast="MCP servers">MCP servers</button>
        </div>
      </nav>
      <div class="cn-groups" id="sessionGroups"></div>
    </div>

    <div class="sb-bottom">
      <div class="sb-bottom-row">
        <button class="user-chip" id="userChip">
          <span class="spark user-spark"></span>
          <span class="user-name" id="userName">Pi Desktop <span class="user-plan" id="userPlan"></span></span>
          <svg class="chev" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8l4 4 4-4"/></svg>
        </button>
        <button class="ic-btn code-only" id="sbSearch" title="Search  Ctrl+K"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg></button>
      </div>
      <div class="user-menu" id="userMenu">
        <div class="menu-email" id="menuInfo">pi coding agent</div>
        <button class="menu-item" id="themeToggle">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 11.5A6.5 6.5 0 0 1 8.5 4a6.5 6.5 0 1 0 7.5 7.5z"/></svg>
          <span>切换深色 / 浅色</span>
        </button>
        <button class="menu-item" id="keysBtn">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="12" r="3.5"/><path d="M9.5 9.5 16 3M13.5 5.5l2 2M12 7l1.5 1.5"/></svg>
          <span>API keys…</span>
        </button>
        <button class="menu-item" id="osToggle">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M2.5 7h15"/></svg>
          <span>窗口样式：macOS / Windows</span>
        </button>
        <button class="menu-item" id="settingsBtn">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
          <span>设置</span>
        </button>
        <div class="menu-sep"></div>
        <button class="menu-item">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 4H5a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 5 16h3M12.5 13.5 16 10l-3.5-3.5M16 10H8"/></svg>
          <span>退出登录</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============ Cowork 主区域 ============ -->
  <main class="main" id="chatMain">
    <header class="topbar">
      <button class="icon-btn mobile-only open-sb" title="菜单">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <button class="chat-title" id="chatTitle" hidden>
        <span id="chatTitleText">新任务</span>
        <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8l4 4 4-4"/></svg>
      </button>
      <div class="topbar-right">
        <button class="share-btn" id="shareBtn" hidden>Share</button>
      </div>
    </header>

    <section class="welcome" id="welcome">
      <h1 class="greeting">
        <span class="spark" aria-hidden="true"></span>
        <span id="greetText">You’re here!</span>
      </h1>
      <div class="composer-slot" id="welcomeSlot"></div>
      <div class="ideas">
        <div class="ideas-h">Ideas for you</div>
        <button class="chip idea" data-prompt="每个工作日早上 8 点给我发一份简报：日程、待办和重要邮件">
          <span class="idea-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="3.5" width="16" height="17" rx="1.5"/><path d="M7.5 16a4.5 4.5 0 0 1 9 0M12 8v1.5M8 10l1 1M16 10l-1 1M6.5 16h11"/></svg></span>Send me a daily briefing
        </button>
        <button class="chip idea" data-prompt="帮我整理收件箱：归类、标记需要回复的邮件，并起草回复">
          <span class="idea-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 9.5h9l2 2.5h6v5.5a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 17.5z"/><path d="M6 6.5h4M12 6.5h3M17 6.5h1"/></svg></span>Organize my inbox
        </button>
        <button class="chip idea" data-prompt="根据我的工作方式，帮我定制 Cowork：推荐合适的技能和连接器">
          <span class="idea-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="3.5" width="16" height="17" rx="1.5"/><path d="M7 8h10M7 11h10M7 14h6M7 17.5l1.5-1.5"/></svg></span>Customize Cowork for me
        </button>
      </div>
    </section>


    <div class="composer" id="composer">
      <div class="cw-box">
        <div class="attachments" id="attachments"></div>
        <textarea id="input" rows="1" placeholder="How can I help you today?"></textarea>
        <div class="composer-row">
          <div class="composer-left">
            <button class="tool-btn" id="attachBtn" title="Add files">
              <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 4v12M4 10h12"/></svg>
            </button>
            <button class="tool-btn toggle" id="thinkBtn" hidden></button>
            <input type="file" id="fileInput" multiple hidden>
          </div>
          <div class="composer-right">
            <div class="model-picker">
              <button class="model-btn" id="modelBtn"><span id="modelName">…</span><span class="eff" id="coworkEffort"></span></button>
              <div class="model-menu" id="modelMenu"></div>
            </div>
            <button class="send-btn" id="sendBtn" disabled title="Send">
              <svg class="i-send" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 16V4M5 9l5-5 5 5"/></svg>
              <svg class="i-stop" viewBox="0 0 20 20" width="14" height="14" fill="currentColor"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="cw-tray">
        <div class="pop-wrap">
        <button class="tray-btn" id="folderBtn">
          <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5.5" width="14" height="10.5" rx="1.8"/><path d="M5 3.5h10"/></svg>
          <span id="folderName">Project or folder</span>
          <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8l4 4 4-4"/></svg>
        </button>
        <div class="pop" id="folderMenu"></div>
        </div>
        <button class="ic-btn sm" data-toast="Cowork 会在你选择的文件夹里读写文件；删除、移动或往外发送数据前都会先问你。不选文件夹时会新建一个临时工作区。" title="Info"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M10 9v4.5M10 6.5v.01"/></svg></button>
      </div>
    </div>
  </main>

  <!-- ============ Code 主区域 ============ -->
  <main class="main code-main" id="codeMain">
      <header class="ch">
        <button class="ic-btn mobile-only open-sb" title="Menu">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
        <span class="ch-new" id="chNew">New session</span>
        <div class="ch-title" id="sessTitle">
          <span class="ch-env" id="sessEnv" title="Local"></span>
          <button class="ch-name-btn" id="sessNameBtn"><span class="ch-name" id="sessName">New session</span>
            <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 8l4 4 4-4"/></svg></button>
          <span class="tag" id="sessRepo">todo-app</span>
        </div>
        <div class="ch-actions" id="codeActions">
          <button class="ic-btn code-act" id="termBtn" title="Terminal  Ctrl+`"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6l4 4-4 4M10 15h6"/></svg></button>
          <button class="ic-btn sess-only code-act" id="diffBtn" title="Diff  Ctrl+D"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="13" height="13" rx="2.5"/><path d="M10 6.5v5M7.5 9h5M7.5 13.5h5"/></svg></button>
          <button class="ic-btn code-act" id="previewBtn" title="Preview"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c2 2 3 4.4 3 7s-1 5-3 7c-2-2-3-4.4-3-7s1-5 3-7z"/></svg></button>
          <button class="ic-btn code-act" id="filesBtn" title="Files"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 6a2 2 0 0 1 2-2h3.2l1.6 1.8h6.2a2 2 0 0 1 2 2V14a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z"/></svg></button>
          <button class="ic-btn cowork-act" id="panelBtn" title="Progress"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M12.5 3.5v13"/></svg></button>
          <div class="pop-wrap">
            <button class="ic-btn" id="openInBtn" title="Open in…"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 6a2 2 0 0 1 2-2h3.2l1.6 1.8h6.2a2 2 0 0 1 2 2V14a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z"/></svg></button>
            <div class="pop pop-right" id="openInMenu">
              <div class="pop-label">Open in</div>
              <button class="menu-item" data-app="VS Code"><span class="app-ico" style="background:#2f80ed">VS</span>VS Code</button>
              <button class="menu-item" data-app="Cursor"><span class="app-ico" style="background:#3a3a3a">Cu</span>Cursor</button>
              <button class="menu-item" data-app="Terminal"><span class="app-ico" style="background:#444">&gt;_</span>Terminal</button>
              <button class="menu-item" data-app="Explorer"><span class="app-ico" style="background:#e3a21a">F</span>File Explorer</button>
            </div>
          </div>
          <button class="ic-btn sess-only" id="sessMoreBtn" title="More"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="10" cy="4.5" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="10" cy="15.5" r="1.4"/></svg></button>
        </div>
      </header>

    <div class="code-center">
      <!-- 新会话：项目选择 -->
      <section class="code-welcome" id="codeWelcome">
        <div class="cw-mid">
          <div class="proj-card">
            <div id="projList"></div>
            <div class="proj-sep"></div>
            <div class="pop-wrap">
              <button class="proj-env" id="envBtn"><span id="envName">Choose environment</span>
                <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8l4 4 4-4"/></svg></button>
              <div class="pop" id="envMenu">
                <div class="pop-label">Environment</div>
                <button class="menu-item opt" data-v="Local"><b>Local</b><small>在这台电脑上运行</small></button>
                <button class="menu-item opt" data-v="Cloud" disabled style="opacity:.5"><b>Cloud</b><small>即将推出</small></button>
                <div class="menu-sep"></div>
                <label class="menu-item check-row"><input type="checkbox" id="worktreeChk" checked> Use isolated worktree</label>
              </div>
            </div>
          </div>
          <button class="import-card" id="importBtn">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6l4 4-4 4M10 15h6"/></svg>
            <span id="importLabel">Import pi CLI sessions</span>
          </button>
        </div>
        <div class="code-bottom"><div class="composer-slot" id="codeWelcomeSlot"></div></div>
      </section>

      <!-- 会话 -->
      <section class="code-thread" id="codeThread" hidden>
        <div class="code-msgs" id="codeMsgs"></div>
        <div class="code-bottom">
          <div class="composer-slot" id="codeThreadSlot"></div>
        </div>
      </section>

      <!-- Code 输入区 -->
      <div class="cx" id="codeComposer">
        <div class="pr-bar" id="prBar" hidden></div>
        <div class="cx-box">
          <svg class="clawd" id="clawd" viewBox="0 0 22 14" width="44" height="28" shape-rendering="crispEdges" aria-hidden="true">
            <g fill="#d97757">
              <rect x="3" y="0" width="16" height="10"/>
              <rect x="0" y="4" width="3" height="3"/><rect x="19" y="4" width="3" height="3"/>
              <rect x="4" y="10" width="2" height="4"/><rect x="8" y="10" width="2" height="4"/><rect x="12" y="10" width="2" height="4"/><rect x="16" y="10" width="2" height="4"/>
            </g>
            <g fill="#141413" class="eyes"><rect x="6" y="3" width="2" height="2"/><rect x="14" y="3" width="2" height="2"/></g>
          </svg>
          <div class="ac-pop" id="acPop"></div>
          <div class="attachments" id="codeAttachments" aria-live="polite"></div>
          <button class="ic-btn sm cx-plus" id="codeAttach" title="Add files (type @ to reference a project file)"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 4v12M4 10h12"/></svg></button>
          <textarea id="codeInput" rows="1" placeholder="Describe a task or ask a question"></textarea>
          <button class="cx-send" id="codeSend" title="Send">
            <svg class="i-ret" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15.5 4.5v5a2 2 0 0 1-2 2H5M8 8.5l-3 3 3 3"/></svg>
            <svg class="i-stop" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><rect x="7.5" y="7.5" width="5" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
        <div class="cx-foot">
          <div class="pop-wrap">
            <button class="foot-btn" id="repoBtn" title="Project">
              <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="4.5" width="13" height="8.5" rx="1.5"/><path d="M2 15.5h16"/></svg>
              <span id="repoName">No project</span>
            </button>
            <div class="pop pop-up" id="repoMenu"></div>
          </div>
          <div class="pop-wrap">
            <button class="foot-btn" id="permBtn" title="Mode  Shift+Tab"><span id="permName">Auto</span></button>
            <div class="pop pop-up" id="permMenu"></div>
          </div>
          <div class="cx-spacer"></div>
          <div class="pop-wrap">
            <button class="foot-btn" id="codeModelBtn"><span id="codeModelName">…</span></button>
            <div class="pop pop-up pop-right" id="codeModelMenu">
              <div class="pop-label">Model</div>
              <button class="menu-item opt" data-v="Opus 5.5"><b>Opus 5.5</b><small>1M context · 复杂编码与长任务</small></button>
              <button class="menu-item opt" data-v="Sonnet 5.5"><b>Sonnet 5.5</b><small>速度与能力的平衡</small></button>
              <button class="menu-item opt" data-v="Haiku 5.5"><b>Haiku 5.5</b><small>最快，适合小改动</small></button>
            </div>
          </div>
          <div class="pop-wrap">
            <button class="foot-btn eff" id="effortBtn"><span id="effortName">High</span></button>
            <div class="pop pop-up pop-right" id="effortMenu">
              <div class="pop-label">Effort</div>
              <button class="menu-item opt" data-v="Low"><b>Low</b><small>最快响应</small></button>
              <button class="menu-item opt" data-v="Medium"><b>Medium</b></button>
              <button class="menu-item opt" data-v="High"><b>High</b></button>
              <button class="menu-item opt" data-v="Extra"><b>Extra</b><small>更多思考，适合复杂问题</small></button>
              <button class="menu-item opt" data-v="Max"><b>Max</b><small>最深入的推理</small></button>
            </div>
          </div>
          <button class="ctx-ring" id="ctxRing" title="Context">
            <svg viewBox="0 0 20 20" width="17" height="17"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.6"/><circle id="ctxArc" cx="10" cy="10" r="7" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="0 44" stroke-linecap="round" transform="rotate(-90 10 10)"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 工具工作区：两列可独立调整宽度，每列内可调整卡片高度 -->
    <div id="workspaceResize" class="pane-resize" hidden></div>
    <div class="right-col" id="rightCol">
      <div class="dock-column" id="dockPrimary">
      <section class="card" id="diffCard" hidden>
        <header class="card-h">
          <div class="pop-wrap">
            <button class="ic-btn sm" id="fileListBtn" title="Files"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 5.5h10M7 10h10M7 14.5h10M3.5 5.5h.01M3.5 10h.01M3.5 14.5h.01"/></svg></button>
            <div class="pop" id="fileListMenu"></div>
          </div>
          <span class="card-branch"><span id="diffBase">main</span><span class="arrow">→</span><span id="diffHead">claude/x</span>
            <svg viewBox="0 0 20 20" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8l4 4 4-4"/></svg></span>
          <div class="card-tools">
            <button class="ic-btn sm" data-t="search" title="Search"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg></button>
            <button class="ic-btn sm" data-t="more" title="View options"><svg viewBox="0 0 20 20" width="15" height="15" fill="currentColor"><circle cx="10" cy="4.5" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="10" cy="15.5" r="1.3"/></svg></button>
            <button class="ic-btn sm" data-t="pop" title="Pop out"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="6.5" width="10" height="10" rx="2"/><path d="M7 3.5h7.5a2 2 0 0 1 2 2V13"/></svg></button>
            <button class="ic-btn sm" data-t="expand" title="Expand"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11.5 3.5h5v5M16.5 3.5 11 9M8.5 16.5h-5v-5M3.5 16.5 9 11"/></svg></button>
            <button class="ic-btn sm" data-t="close" title="Close"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5l10 10M15 5 5 15"/></svg></button>
          </div>
        </header>
        <div class="card-b diff-body" id="diffBody"></div>
      </section>

      <section class="card" id="previewCard" hidden>
        <header class="card-h" id="previewHead"></header>
        <div class="card-b" id="previewBody"></div>
      </section>

      <section class="card" id="bottomCard" hidden>
        <header class="card-h" id="bottomHead"></header>
        <div class="card-b" id="bottomBody"></div>
      </section>
      </div>
      <div id="columnsResize" class="pane-resize" hidden></div>
      <div class="dock-column" id="dockSecondary">
        <section class="card" id="filesCard" hidden>
          <header class="card-h" id="filesHead"></header>
          <div class="files-filter"><input id="filesFilter" placeholder="Filter files" aria-label="Filter files" spellcheck="false"></div>
          <div class="card-b file-tree" id="filesBody"></div>
        </section>
        <section class="card" id="terminalCard" hidden>
          <header class="card-h" id="terminalHead"></header>
          <div class="card-b" id="terminalBody"></div>
        </section>
      </div>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>
</div>
</div>

<!-- 搜索面板 -->
<div class="palette-wrap" id="palette" hidden>
  <div class="palette">
    <div class="pal-in">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
      <input id="palInput" placeholder="Search sessions, tasks and actions…">
      <kbd>esc</kbd>
    </div>
    <div class="pal-list" id="palList"></div>
  </div>
</div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-acts" id="modalActs"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Session menu lives at the root: fixed positioning keeps it out of the header's
     overflow clipping and out of the transcript's stacking context. -->
<div class="pop" id="sessMenu">
  <button class="menu-item" data-act="rename">Rename</button>
  <button class="menu-item" data-act="fork">Fork session</button>
  <button class="menu-item" data-act="copy">Copy session link</button>
  <div class="menu-sep"></div>
  <button class="menu-item danger" data-act="archive">Archive</button>
</div>
<script src="app.js"></script>
<script src="workspace.js"></script>
<script src="tool-previews.js"></script>
<script src="attachments.js"></script>
<script src="composer.js"></script>
<script src="code.js"></script>
<script src="shell.js"></script>
</body>
</html>
